{% extends "email/base.html" %}
{% block content %}
<h2>Booking Cancelled</h2>
<p>Hello {{ user.get_full_name }},</p>
<p>The booking for <strong>{{ booking.asset.name }}</strong> has been cancelled.</p>
{% if data.reason %}<p><strong>Reason:</strong> {{ data.reason }}</p>{% endif %}
<p><a href="{{ settings.FRONTEND_URL }}{{ action_url }}">View Details</a></p>
{% endblock %}
